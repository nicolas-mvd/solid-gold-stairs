name: Build Minecraft 26.2 port
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node tools/generate-resources.mjs
      - run: git diff --exit-code -- src/main/resources
      - run: bash ./gradlew build smokeJar
      - run: node tools/validate-resources.mjs "$HOME/.gradle/caches/fabric-loom/26.2/minecraft-client.jar"
