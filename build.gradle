plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'solid_gold_stairs' }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
// Historical 1.20.1 datagen is retained for reference.
// 26.2 resources are generated by tools/generate-resources.mjs.
sourceSets.main.java { exclude '**/datagen/**', '**/SolidGoldStairsDataGenerator.java' }
processResources {
    // 1.20.1 plural data directories are kept in source for provenance only.
    exclude 'data/**/recipes/**', 'data/**/tags/blocks/**', 'data/**/tags/items/**'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar { from('LICENSE', 'NOTICE'); from('LICENSES') { into 'LICENSES' } }
tasks.named('sourcesJar') {
    from('LICENSE', 'NOTICE')
    from('LICENSES') { into 'LICENSES' }
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Separate integration-test mod; never included in the downloadable mod JAR.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('smokeJar', Jar) {
    dependsOn smokeClasses
    archiveClassifier = 'smoke-tests'
    from sourceSets.smoke.output
}
